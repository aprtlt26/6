<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>TELESMA | Grabado Real (Sin nubes blancas)</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: rgb(0, 55, 255);
            cursor: none !important;
            touch-action: none;
        }
        * { cursor: none !important; }
        canvas { display: block; cursor: none !important; }
    </style>
</head>
<body>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/addons/p5.sound.min.js"></script>
    <script>
        let particles = [];
        let cubeSize = 400;
        let audioStarted = false;
        let particleOscillators = [];
        let convolutionReverb;
        let lastSoundTime = 0;
        let soundInterval = 0.5;
        let rotationXValue = 0;
        let rotationYValue = 0;
        let prevMouseX = 0;
        let prevMouseY = 0;
        let speed = 0;
        let wetness = 0.3;  
        let zTranslation = 0; 
        let particleCount = 150; 
        
        // Desvanecimiento lento para que las huellas desaparezcan
        let fadeAlpha = 8; 

        function preload() {
            convolutionReverb = new p5.Convolver('https://p5js.org/assets/sound/examples/convolution-reverb/ir_latenightlong.wav');
        }

        function setup() {
            createCanvas(windowWidth, windowHeight, WEBGL);
            noStroke();
            document.querySelector('canvas').style.cursor = 'none';

            if (windowWidth < 600) {
                cubeSize = 800;  
            }

            for (let i = 0; i < particleCount; i++) {
                let particle = new Particle();
                particles.push(particle);

                if (i < 200) {
                    let osc = new p5.Oscillator('sine');
                    osc.freq(random(100, 12000));  
                    osc.amp(0);  
                    osc.start();

                    osc.disconnect();
                    osc.connect(convolutionReverb);

                    particleOscillators.push(osc);
                }
            }

            convolutionReverb.drywet(wetness);  
            
            // === FONDO AZUL FIJO ===
            background(0, 55, 255);
            
            noLoop();  
        }

        function draw() {
            if (!audioStarted) return;

            // === DESVANECIMIENTO DEL FONDO (Para que las huellas se borren solas) ===
            // En lugar de limpiar el fondo, dibujamos un rectángulo azul semitransparente
            // Esto hace que las huellas viejas se desvanezcan lentamente.
            push();
            translate(-width/2, -height/2);
            noStroke();
            fill(0, 55, 255, fadeAlpha); // Azul del fondo con transparencia
            rect(0, 0, width, height);
            pop();

            // ============================================================
            // MOVIMIENTO 3D Y PARTÍCULAS
            // ============================================================
            speed = dist(mouseX, mouseY, prevMouseX, prevMouseY) * 0.01;
            prevMouseX = mouseX;
            prevMouseY = mouseY;

            let deltaX = (mouseX - width / 2) * 0.01;
            let deltaY = (mouseY - height / 2) * 0.01;
            rotationXValue = deltaY;
            rotationYValue = deltaX;

            translate(0, 0, zTranslation); 
            rotateX(rotationXValue);
            rotateY(rotationYValue);

            for (let i = 0; i < particleCount; i++) {
                let p = particles[i];
                p.move();
                p.show();

                if (i < 50 && millis() - lastSoundTime > soundInterval) {
                    let osc = particleOscillators[i];
                    let freq = random(100, 8000) + speed * 3000;
                    osc.freq(freq);
                    
                    let panValue = map(p.pos.x, -cubeSize / 2, cubeSize / 2, -1, 1);
                    osc.pan(panValue);
                    
                    osc.amp(0.05, 0.001);
                    setTimeout(() => osc.amp(0, 0.1), random(10, 5)); 

                    p.highlight();  
                    lastSoundTime = millis();  
                }

                // Conexiones entre partículas
                for (let j = i + 1; j < particleCount; j++) {
                    let d = dist(p.pos.x, p.pos.y, p.pos.z, particles[j].pos.x, particles[j].pos.y, particles[j].pos.z);
                    if (d < 90) {  
                        let alpha = map(d, 0, 90, 200, 15);
                        stroke(255, alpha);  
                        strokeWeight(map(d, 0, 90, 2.0, 0.4));
                        line(p.pos.x, p.pos.y, p.pos.z, particles[j].pos.x, particles[j].pos.y, particles[j].pos.z);
                    }
                }
            }
        }

        function keyPressed() {
            if (keyCode === UP_ARROW) {
                zTranslation -= 50; 
                particleCount = max(10, particleCount - 10); 
            }

            if (keyCode === DOWN_ARROW) {
                zTranslation += 50; 
                particleCount = min(particles.length, particleCount + 10); 
            }
        }

        function mousePressed() {
            if (!audioStarted) {
                userStartAudio();
                audioStarted = true;
                loop(); 
            }
        }

        function touchStarted() {
            if (!audioStarted) {
                userStartAudio();
                audioStarted = true;
                loop(); 
            }
            return false;
        }

        function windowResized() {
            resizeCanvas(windowWidth, windowHeight); 
            document.querySelector('canvas').style.cursor = 'none';
        }

        class Particle {
            constructor() {
                this.pos = createVector(
                    random(-cubeSize / 2, cubeSize / 2),
                    random(-cubeSize / 2, cubeSize / 2),
                    random(-cubeSize / 2, cubeSize / 2)
                );
                this.vel = p5.Vector.random3D().mult(0.09);
                this.acc = createVector();
                this.isHighlighted = false; 
                this.prevScreenX = 0;
                this.prevScreenY = 0;
            }

            move() {
                this.acc = p5.Vector.random3D().mult(0.9);
                this.vel.add(this.acc);
                this.pos.add(this.vel);

                if (this.pos.x > cubeSize / 2 || this.pos.x < -cubeSize / 2) this.vel.x *= -1;
                if (this.pos.y > cubeSize / 2 || this.pos.y < -cubeSize / 2) this.vel.y *= -1;
                if (this.pos.z > cubeSize / 2 || this.pos.z < -cubeSize / 2) this.vel.z *= -1;
            }

            show() {
                push();
                translate(this.pos.x, this.pos.y, this.pos.z);

                if (this.isHighlighted) {
                    stroke(255, 255, 200);
                    strokeWeight(4);
                    this.isHighlighted = false;  
                } else {
                    stroke(255);
                    strokeWeight(2.5); 
                }

                point(0, 0);
                pop();

                // === GRABADO EN RELIEVE (Sin nubes blancas) ===
                let screenX = this.pos.x + width / 2;
                let screenY = this.pos.y + height / 2;
                
                push();
                translate(-width/2, -height/2);
                noStroke();
                
                // 1. SOMBRA (Azul oscuro, desplazada abajo-derecha)
                fill(0, 30, 180, 80);
                ellipse(screenX + 2, screenY + 2, 6, 6);
                
                // 2. LUZ (Cian brillante, desplazada arriba-izquierda)
                fill(100, 200, 255, 60);
                ellipse(screenX - 1, screenY - 1, 5, 5);
                
                // 3. CENTRO (El color del fondo, para que el surco se fusione)
                fill(0, 55, 255, 100);
                ellipse(screenX, screenY, 4, 4);
                
                pop();
            }

            highlight() {
                this.isHighlighted = true;  
            }
        }
    </script>
</body>
</html>
