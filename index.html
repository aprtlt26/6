<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="viewport" content="width=device-width, initial-scale=1.0">
    <title>aprtlt®grnlr</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: rgb(255, 255, 255);
            cursor: none;
            touch-action: none;
        }
    </style>
</head>
<body>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/addons/p5.sound.min.js"></script>
    <script>
        let particles = [];
        let cubeSize = 400;
        let audioStarted = false;
        let particleOscillators = [];
        let convolutionReverb;
        let lastSoundTime = 0;
        let soundInterval = 0.5;
        let rotationXValue = 0;
        let rotationYValue = 0;
        let prevMouseX = 0;
        let prevMouseY = 0;
        let speed = 0;
        let wetness = 0.3;  
        let zTranslation = 0; 
        let particleCount = 150; 

        function preload() {
            convolutionReverb = new p5.Convolver('https://p5js.org/assets/sound/examples/convolution-reverb/ir_latenightlong.wav');
        }

        function setup() {
            createCanvas(windowWidth, windowHeight, WEBGL);
            noStroke();

            if (windowWidth < 600) {
                cubeSize = 800;  
            }

            // Crear partículas dentro del cubo
            for (let i = 0; i < particleCount; i++) {
                let particle = new Particle();
                particles.push(particle);

                if (i < 200) {
               
                    let osc = new p5.Oscillator('sine');
                    osc.freq(random(100, 12000));  
                    osc.amp(0);  
                    osc.start();

                    osc.disconnect();
                    osc.connect(convolutionReverb);

                    particleOscillators.push(osc);
                }
            }

            convolutionReverb.drywet(wetness);  
            background(0);
            noLoop();  
        }

        function draw() {
            if (!audioStarted) return;

            background(0);

            speed = dist(mouseX, mouseY, prevMouseX, prevMouseY) * 0.01;
            prevMouseX = mouseX;
            prevMouseY = mouseY;

            let deltaX = (mouseX - width / 2) * 0.01;
            let deltaY = (mouseY - height / 2) * 0.01;
            rotationXValue = deltaY;
            rotationYValue = deltaX;

            translate(0, 0, zTranslation); 
            rotateX(rotationXValue);
            rotateY(rotationYValue);

            for (let i = 0; i < particleCount; i++) {
                let p = particles[i];
                p.move();
                p.show();

                if (i < 50 && millis() - lastSoundTime > soundInterval) {
                    let osc = particleOscillators[i];
                    osc.freq(random(100, 12000) + speed * 5000);  
                    osc.pan(map(p.pos.x, -cubeSize / 4, cubeSize / 4, -2, 2)); 
                    osc.amp(0.1, 0.001); 
                    setTimeout(() => osc.amp(0, 0.1), random(10, 5)); 

                    p.highlight();  
                    lastSoundTime = millis();  
                }

                for (let j = i + 1; j < particleCount; j++) {
                    let d = dist(p.pos.x, p.pos.y, p.pos.z, particles[j].pos.x, particles[j].pos.y, particles[j].pos.z);
                    if (d < 60) {  
                        stroke(255, 60);  
                        strokeWeight(0.2);
                        line(p.pos.x, p.pos.y, p.pos.z, particles[j].pos.x, particles[j].pos.y, particles[j].pos.z);
                    }
                }
            }

            push();
            fill(0);
            noStroke();
            translate(mouseX - width / 2, mouseY - height / 2, 50);  
            sphere(5);  
            pop();
        }

        function keyPressed() {
            if (keyCode === UP_ARROW) {
                zTranslation -= 50; 
                particleCount = max(10, particleCount - 10); 
                console.log("zTranslation: ", zTranslation, " | particleCount: ", particleCount);
            }

            if (keyCode === DOWN_ARROW) {
                zTranslation += 50; 
                particleCount = min(particles.length, particleCount + 10); 
                console.log("zTranslation: ", zTranslation, " | particleCount: ", particleCount);
            }
        }

        function mousePressed() {
            if (!audioStarted) {
                userStartAudio();
                audioStarted = true;
                loop(); 
            }
        }

        function windowResized() {
            resizeCanvas(windowWidth, windowHeight); 
        }

        class Particle {
            constructor() {
                this.pos = createVector(
                    random(-cubeSize / 2, cubeSize / 2),
                    random(-cubeSize / 2, cubeSize / 2),
                    random(-cubeSize / 2, cubeSize / 2)
                );
                this.vel = p5.Vector.random3D().mult(0.09);
                this.acc = createVector();
                this.isHighlighted = false; 
            }

            move() {
                this.acc = p5.Vector.random3D().mult(0.9);
                this.vel.add(this.acc);
                this.pos.add(this.vel);

                if (this.pos.x > cubeSize / 2 || this.pos.x < -cubeSize / 2) this.vel.x *= -1;
                if (this.pos.y > cubeSize / 2 || this.pos.y < -cubeSize / 2) this.vel.y *= -1;
                if (this.pos.z > cubeSize / 2 || this.pos.z < -cubeSize / 2) this.vel.z *= -1;
            }

            show() {
                push();
                translate(this.pos.x, this.pos.y, this.pos.z);

                if (this.isHighlighted) {
                    stroke(255, 255, 200);
                    strokeWeight(2);
                    this.isHighlighted = false;  
                } else {
                    stroke(255);
                    strokeWeight(0.5);  
                }

                point(0, 0);
                pop();
            }

            highlight() {
                this.isHighlighted = true;  
            }
        }

let video;
let hands;
let handDetected = false;
let pinchDistance = 0;

async function initHandTracking(stream) {
    video = createCapture(VIDEO);
    video.size(640, 480);
    video.hide();

    hands = new Hands({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
        maxNumHands: 1,
        modelComplexity: 1,
        minDetectionConfidence: 0.7,
        minTrackingConfidence: 0.7
    });

    hands.onResults(onHandResults);

    const camera = new Camera(video.elt, {
        onFrame: async () => {
            await hands.send({ image: video.elt });
        },
        width: 640,
        height: 480
    });
    camera.start();
}
let prevAvgX = null;
let prevAvgY = null;

function onHandResults(results) {
  handDetected = results.multiHandLandmarks && results.multiHandLandmarks.length > 0;

  if (handDetected) {
    let landmarks = results.multiHandLandmarks[0];

    let avgX = 0, avgY = 0;
    for (let lm of landmarks) {
      avgX += lm.x;
      avgY += lm.y;
    }
    avgX /= landmarks.length;
    avgY /= landmarks.length;

    if (prevAvgX !== null && prevAvgY !== null) {
      let deltaX = avgX - prevAvgX;
      let deltaY = avgY - prevAvgY;

      rotationYValue += deltaX * 15; // izquierda-derecha
      rotationXValue -= deltaY * 15; // arriba-abajo
    }
    prevAvgX = avgX;
    prevAvgY = avgY;

    // --- 2. Giro de muñeca → rotación Z ---
    // Calculamos el ángulo entre índice (8) y meñique (20)
    let index = landmarks[8];
    let pinky = landmarks[20];
    let angle = atan2(pinky.y - index.y, pinky.x - index.x);

    // Ajustar sensibilidad de rotación Z
    rotationZValue = angle * 2.5;

    // --- 3. Pinza → Zoom y control de partículas ---
    let thumb = landmarks[4];
    let pinchDistance = dist(thumb.x, thumb.y, index.x, index.y);

    // Zoom Z
    zTranslation = map(pinchDistance, 0.02, 0.25, 500, -500, true);

    // Partículas (reducción rápida tipo tecla ↑)
    let mappedCount = int(map(pinchDistance, 0.02, 0.25, particles.length, 20, true));
    let diff = mappedCount - particleCount;
    particleCount += diff * 0.6; // sensibilidad de reacción de partículas
    particleCount = constrain(particleCount, 10, particles.length);
  } else {
    prevAvgX = null;
    prevAvgY = null;
  }
}




// 🚀 Pedir permiso de cámara al cargar la página
navigator.mediaDevices.getUserMedia({ video: true })
  .then(stream => {
      console.log("✅ Cámara habilitada");
      initHandTracking(stream);
  })
  .catch(err => {
      console.error("❌ Acceso a cámara denegado:", err);
  });



    </script>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>

</body>
</html>
